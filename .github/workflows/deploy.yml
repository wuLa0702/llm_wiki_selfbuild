# ============================================================
# LLM Wiki 自动部署工作流（self-hosted runner）
# 触发：push 到 main 即自动部署（原版为 tag 触发，已按需求修改）
#
# 环境事实（与本机部署一致）：
#   - 部署目录: /home/ubuntu/app
#   - 服务:     systemd llm-wiki（venv Python 3.12 + uvicorn :8000）
#   - 依赖:     requirements-min.txt（最小集，无 chromadb/sentence-transformers）
#
# 数据保护：rsync 排除 .env/.venv/*.db/wiki/raw/logs
#   → --delete 不会误删服务器上的数据和密钥
#
# 公开仓库安全：只监听 push 到 main，绝不监听 PR 事件
# ============================================================
name: Deploy

on:
  push:
    branches: [main]        # 仅 main 分支推送触发
  workflow_dispatch:        # 手动触发（仓库 Actions 页）

jobs:
  deploy:
    runs-on: [self-hosted, deploy]   # 匹配本机 runner 标签
    concurrency: deploy              # 同一时间只跑一个部署
    steps:
      - uses: actions/checkout@v4

      - name: 构建前端（wiki-ui-v2 → dist）
        working-directory: wiki-ui-v2
        run: |
          set -e
          npm install
          npm run build

      - name: 同步代码到部署目录（排除运行数据与密钥）
        run: |
          set -e
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='.env' \
            --exclude='*.db' \
            --exclude='wiki/' \
            --exclude='raw/' \
            --exclude='logs/' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            ./ /home/ubuntu/app/

      - name: 安装依赖（最小集，幂等）
        run: |
          set -e
          cd /home/ubuntu/app
          [ -d .venv ] || python3.12 -m venv .venv
          .venv/bin/pip install -r requirements-min.txt

      - name: 重启服务
        run: |
          set -e
          sudo systemctl restart llm-wiki

# 以后需要语义搜索时：
#   1. 取消 requirements-min.txt 中 chromadb/sentence-transformers 注释
#      （本机无 GPU，务必用 CPU 版 torch：pip install torch --index-url https://download.pytorch.org/whl/cpu）
#   2. 在设置页打开语义搜索开关
