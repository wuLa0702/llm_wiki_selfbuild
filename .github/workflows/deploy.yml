# 远程服务器部署（GitHub Actions self-hosted runner）
#
# 用法：
#   1. 在服务器上注册 self-hosted runner（Settings → Actions → Runners → New self-hosted runner）
#   2. 确保服务器已配置 systemd 服务 `llm-wiki`（见下方服务模板注释）
#   3. 打 tag（如 v0.9）触发部署，或在 Actions 页面手动运行（workflow_dispatch）
#
# 部署内容：
#   - 拉取 tag 对应代码 → 安装最小依赖（requirements-min.txt，不装语义搜索重依赖）
#   - 构建前端（wiki-ui-v2/dist）→ 同步到 /opt/llm-wiki → 重启服务
#
# systemd 服务模板（/etc/systemd/system/llm-wiki.service）：
#   [Unit]
#   Description=LLM Wiki
#   After=network.target
#   [Service]
#   WorkingDirectory=/opt/llm-wiki
#   ExecStart=/usr/bin/python3 -m uvicorn src.main:app --host 0.0.0.0 --port 8766
#   Restart=always
#   Environment=EMBEDDING_ENABLED=false
#   [Install]
#   WantedBy=multi-user.target
#
# 注意：Windows 服务器需改用 .bat 脚本重启，且端口/路径按实际调整。

name: Deploy to Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy (self-hosted)
    runs-on: self-hosted
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-min.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: wiki-ui-v2
        run: |
          npm install
          npm run build

      - name: Sync to deploy directory
        run: |
          sudo rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.models' \
            --exclude 'chroma_db' \
            ./ /opt/llm-wiki/

      - name: Restart service
        run: |
          sudo systemctl restart llm-wiki
          sudo systemctl --no-pager --lines=10 status llm-wiki || true
