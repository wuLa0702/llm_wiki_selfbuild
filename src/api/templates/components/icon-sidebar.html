<aside class="icon-bar">
  <a href="/wiki" class="icon-bar-logo" title="LLM Wiki">✦ LLM Wiki</a>
  <div class="icon-bar-divider"></div>

  <a href="/wiki/query" class="icon-bar-item {% if request.url.path == '/wiki/query' %}active{% endif %}">
    <span class="icon-bar-icon">💬</span>
    <span class="icon-bar-label">问答</span>
  </a>
  <a href="/wiki" class="icon-bar-item {% if request.url.path == '/wiki' %}active{% endif %}">
    <span class="icon-bar-icon">📄</span>
    <span class="icon-bar-label">首页</span>
  </a>
  <a href="/wiki/sources" class="icon-bar-item {% if request.url.path == '/wiki/sources' %}active{% endif %}">
    <span class="icon-bar-icon">📁</span>
    <span class="icon-bar-label">资料源</span>
  </a>
  <a href="/wiki/graph" class="icon-bar-item {% if request.url.path == '/wiki/graph' %}active{% endif %}">
    <span class="icon-bar-icon">🕸️</span>

  </a>
  <a href="/wiki/lint" class="icon-bar-item {% if request.url.path == '/wiki/lint' %}active{% endif %}">
