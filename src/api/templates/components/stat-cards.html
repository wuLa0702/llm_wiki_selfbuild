<div class="stat-cards">
  <div class="stat-card stat-card-accent">
    <div class="stat-value">{{ stats.total }}</div>
    <div class="stat-label">全部页面</div>
  </div>
  <div class="stat-card stat-card-success">
    <div class="stat-value">{{ stats.entity_count }}</div>
    <div class="stat-label">实体</div>
  </div>
  <div class="stat-card stat-card-warning">
    <div class="stat-value">{{ stats.concept_count }}</div>
    <div class="stat-label">概念</div>
  </div>
  <div class="stat-card stat-card-secondary">
    <div class="stat-value">{{ stats.source_count }}</div>
    <div class="stat-label">来源</div>
  </div>
  <div class="stat-card stat-card-error">
    <div class="stat-value" id="broken-count">-</div>
    <div class="stat-label">断链</div>
  </div>
</div>
