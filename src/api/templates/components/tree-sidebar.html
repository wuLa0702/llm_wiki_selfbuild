<aside class="tree-panel" id="treePanel">
  <!-- 搜索框 -->
  <div class="tree-search" style="position:relative;">
    <input id="tree-search-input" type="search" placeholder="搜索 Wiki..." autocomplete="off">
    <div id="tree-search-results" class="search-dropdown hidden"></div>
  </div>

  <!-- 过滤按钮 -->
  <div class="tree-filters" id="tree-filters">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="entity">实体</button>
    <button class="filter-btn" data-filter="concept">概念</button>
    <button class="filter-btn" data-filter="source">来源</button>
    <button class="filter-btn" data-filter="query">问答</button>
  </div>

  <!-- 知识树 -->
  <div class="tree-content" id="tree-content">
    <div class="loading-state" style="padding:1.5rem;">
      <div class="spinner" style="width:18px;height:18px;"></div>
    </div>
  </div>

  <!-- 底部统计 + 活动 -->
  <div class="tree-footer">
    <div class="flex justify-between" style="margin-bottom:0.3rem;">
      <span id="tree-stats">加载中...</span>
    </div>
    <div class="tree-activity">
      <span id="tree-activity-dot" style="width:6px;height:6px;border-radius:50%;background:var(--text-muted);flex-shrink:0;"></span>
      <span id="tree-activity-text" class="text-muted">空闲</span>
    </div>
  </div>
</aside>
