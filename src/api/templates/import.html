{% extends "base.html" %}

{% block title %}批量导入 — LLM Wiki{% endblock %}

{% block content %}
<section class="page-header">
  <h1>📁 批量导入文件夹</h1>
  <p class="text-secondary text-sm">将 raw/sources/ 下的文件夹批量导入为 Wiki 页面。</p>
</section>

<div class="card">
  <div class="form-group" style="margin-bottom:1rem;">
    <label for="folderInput">文件夹路径（相对于 raw/sources/）</label>
    <input id="folderInput" type="text" class="form-input" placeholder="例如: llm-papers" autofocus>
    <p class="text-muted text-xs" style="margin-top:0.25rem;">示例: my-notes、papers/nlp、docs</p>
  </div>

  <div class="flex items-center gap-md" style="flex-wrap:wrap;">
    <label class="flex items-center gap-sm text-sm">
      <input type="checkbox" id="recurseCheck" checked> 递归子目录
    </label>
    <label class="flex items-center gap-sm text-sm">
      <span>模式:</span>
      <select id="modeSelect" style="font-size:0.85rem; padding:0.3em 0.5em; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-surface); color:var(--text-primary);">
        <option value="sync">同步（等待结果）</option>
        <option value="async">异步（后台队列）</option>
      </select>
    </label>
    <button id="importBtn" class="btn btn-primary" onclick="doImport()">开始导入</button>
  </div>
</div>

<div id="resultBox" class="card" style="display:none;">
  <h3 id="resultTitle" style="margin:0 0 0.75rem 0; border:none;">导入结果</h3>
  <div id="resultContent"></div>
</div>

<div id="hint" class="hint">
  <div class="empty-state-icon" style="font-size:1.5rem;">📁</div>
  <p>输入文件夹路径后点击开始导入。</p>
</div>
{% endblock %}

{% block scripts %}
<script>
function doImport() {
  var folder = document.getElementById('folderInput').value.trim();
  if (!folder) { alert('请输入文件夹路径'); return; }
  var btn = document.getElementById('importBtn');
  var box = document.getElementById('resultBox');
  document.getElementById('hint').style.display = 'none';
  box.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '导入中…';

  var mode = document.getElementById('modeSelect').value;
  fetch('/v1/ingest/folder', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      folder_path: folder,
      recurse: document.getElementById('recurseCheck').checked,
      mode: mode,
    }),
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.error) { showResult('error', '出错了', data.error); return; }
    if (mode === 'async') {
      // 异步模式：轮询进度
      var btn2 = document.getElementById('importBtn');
      var total = data.total || data.enqueued || 0;
      if (total > 0) {
        btn2.textContent = '排队中 0/' + total;
        pollQueueProgress(total, btn2);
        return;
      }
    }
    var err = data.failed > 0 && data.success === 0;
    renderResult(data, err);
  })
  .catch(function(err) { showResult('error', '出错了', err.message); })
  .finally(function() { btn.disabled = false; btn.textContent = '开始导入'; });
}

function renderResult(data, isError) {
  var total = data.total || 0, ok = data.success || 0;
  var skip = data.skipped || 0, fail = data.failed || 0;
  var title = isError ? '导入失败' : '&#9989; 导入完成';
  var html = '<div class="stat-cards" style="display:flex; gap:0.75rem; flex-wrap:wrap;">';
  html += '<div class="stat-card" style="flex:1; min-width:60px;"><div class="stat-value" style="font-size:1.5rem;">' + total + '</div><div class="stat-label">文件</div></div>';
  html += '<div class="stat-card" style="flex:1; min-width:60px; border-top-color:var(--success);"><div class="stat-value" style="font-size:1.5rem; color:var(--success);">' + ok + '</div><div class="stat-label">成功</div></div>';
  html += '<div class="stat-card" style="flex:1; min-width:60px; border-top-color:var(--warning);"><div class="stat-value" style="font-size:1.5rem; color:var(--warning);">' + skip + '</div><div class="stat-label">跳过</div></div>';
  html += '<div class="stat-card" style="flex:1; min-width:60px; border-top-color:var(--error);"><div class="stat-value" style="font-size:1.5rem; color:var(--error);">' + fail + '</div><div class="stat-label">失败</div></div>';
  html += '</div>';
  html += '<p class="text-sm text-muted" style="margin-top:0.5rem;">创建 ' + (data.pages_created||0) + ' 页，更新 ' + (data.pages_updated||0) + ' 页</p>';

  if (data.errors && data.errors.length > 0) {
    html += '<div class="text-sm" style="margin-top:0.5rem;"><strong style="color:var(--error);">失败详情</strong></div>';
    html += '<ul class="text-sm" style="list-style:none; padding:0; margin-top:0.3rem;">';
    for (var i = 0; i < data.errors.length; i++) {
      html += '<li style="display:flex; align-items:center; gap:0.5rem; padding:0.3em 0; border-bottom:1px solid var(--border);">';
      html += '<span style="flex:1; word-break:break-all;"><span style="color:var(--error);">&#10007;</span> ' + data.errors[i].file;
      html += '<br><span class="text-xs text-muted">' + data.errors[i].error + '</span></span>';
      html += '<button class="btn btn-sm btn-secondary" style="flex-shrink:0;" onclick="retryFile(\'' + data.errors[i].file.replace(/'/g, "\\'") + '\', this)">重试</button>';
      html += '</li>';
    }
    html += '</ul>';
  }
  showResult(isError ? 'error' : 'success', title, html);
}

function showResult(type, title, content) {
  var box = document.getElementById('resultBox');
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultContent').innerHTML = content;
  box.style.display = 'block';
  box.style.borderColor = type === 'error' ? 'var(--error)' : 'var(--success)';
}

function pollQueueProgress(total, btn) {
  var interval = setInterval(function() {
    fetch('/v1/ingest/queue/status')
      .then(function(r) { return r.json(); })
      .then(function(q) {
        var done = (q.done || 0) + (q.failed || 0);
        btn.textContent = '导入中 ' + done + '/' + total;
        if (done >= total) {
          clearInterval(interval);
          btn.disabled = false;
          btn.textContent = '开始导入';
          // 尝试获取最终结果
          showToast('导入完成: ' + total + ' 个文件');
        }
      })
      .catch(function() { clearInterval(interval); btn.disabled = false; btn.textContent = '开始导入'; });
  }, 2000);
}

function retryFile(filePath, btn) {
  btn.disabled = true;
  btn.textContent = '重试中…';
  fetch('/v1/ingest/folder', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ folder_path: filePath, recurse: false, mode: 'sync' }),
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success > 0) {
      btn.textContent = '✓ 成功';
      btn.style.color = 'var(--success)';
    } else {
      btn.textContent = '失败';
      btn.disabled = false;
      btn.textContent = '重试';
    }
  })
  .catch(function() {
    btn.textContent = '重试';
    btn.disabled = false;
  });
}

document.getElementById('folderInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doImport();
});
</script>
{% endblock %}
