{% extends "base.html" %}

{% block title %}知识问答 — LLM Wiki{% endblock %}

{% block content %}
<section class="page-header">
  <h1>🔍 知识问答</h1>
  <p class="text-secondary text-sm">基于 Wiki 知识库回答你的问题</p>
</section>

<div class="query-input-row">
  <input id="queryInput" type="text" placeholder="向知识库提问…" autofocus>
  <button id="queryBtn" class="btn btn-primary" onclick="doQuery()">查询</button>
</div>

<div class="options text-sm" style="margin-bottom:1rem;">
  <label class="flex items-center gap-sm">
    <input type="checkbox" id="archiveCheck"> 归档答案到 wiki/queries/
  </label>
</div>

<!-- 回答区域 -->
<div id="answerBox" class="query-answer" style="display:none;"></div>
<div id="hint" class="empty-state" style="padding:2rem;">
  <div class="empty-state-icon">💡</div>
  <p class="text-muted">输入问题后点击查询，LLM 将基于 Wiki 知识库回答。</p>
  <p class="text-muted text-sm" style="margin-top:0.5rem;">试试问: "Python 和 Java 的主要区别是什么？"</p>
</div>

<!-- 查询历史 -->
<div id="historySection" class="query-history" style="display:none;">
  <h4>📋 查询历史</h4>
  <div id="historyList"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
/* ===== 查询历史 (localStorage) ===== */
function loadHistory() {
  var history = JSON.parse(localStorage.getItem('queryHistory') || '[]');
  var list = document.getElementById('historyList');
  var section = document.getElementById('historySection');
  if (history.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  list.innerHTML = history.map(function(q, i) {
    return '<div class="query-history-item" onclick="recallQuery(' + i + ')">' + escapeHtml(q) + '</div>';
  }).join('');
}

function addToHistory(q) {
  if (!q || !q.trim()) return;
  var history = JSON.parse(localStorage.getItem('queryHistory') || '[]');
  history = history.filter(function(h) { return h !== q; });
  history.unshift(q);
  if (history.length > 10) history = history.slice(0, 10);
  localStorage.setItem('queryHistory', JSON.stringify(history));
  loadHistory();
}

function recallQuery(index) {
  var history = JSON.parse(localStorage.getItem('queryHistory') || '[]');
  if (index >= 0 && index < history.length) {
    document.getElementById('queryInput').value = history[index];
    doQuery();
  }
}

/* ===== 查询 ===== */
function doQuery() {
  var q = document.getElementById('queryInput').value.trim();
  if (!q) return;

  document.getElementById('hint').style.display = 'none';
  var box = document.getElementById('answerBox');
  box.style.display = 'block';
  box.innerHTML = '<div class="loading-state"><div class="spinner"></div><span>查询中…</span></div>';

  var btn = document.getElementById('queryBtn');
  btn.disabled = true;

  var archive = document.getElementById('archiveCheck').checked;
  var controller = new AbortController();
  var timer = setTimeout(function() { controller.abort(); }, 15000);

  fetch('/v1/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: q, archive: archive }),
    signal: controller.signal,
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    clearTimeout(timer);
    if (data.error) { showError(data.error); return; }
    renderAnswer(data);
    addToHistory(q);
  })
  .catch(function(err) {
    clearTimeout(timer);
    if (err.name === 'AbortError') {
      showError('请求超时（15s），LLM 回答较慢，请稍后重试');
    } else {
      showError('网络错误：' + err.message);
    }
  })
  .finally(function() { btn.disabled = false; });
}

function renderAnswer(data) {
  var box = document.getElementById('answerBox');
  var answer = data.answer || '';
  var conf = data.confidence || 'low';
  var confLabels = { high: '高', medium: '中', low: '低' };
  var sources = data.sources || [];

  // 给每个来源分配编号
  var sourceMap = {};
  for (var i = 0; i < sources.length; i++) {
    sourceMap[sources[i]] = i + 1;
  }

  // 回答正文：wikilinks 替换为带编号的引用
  var renderedAnswer = answer.replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g, function(match, target, display) {
    var label = display || target.replace(/\.md$/, '').split('/').pop();
    var num = sourceMap[target];
    if (num) {
      return label + '<sup><a href="/wiki/' + target + '" class="wikilink" style="font-size:0.75rem;color:var(--accent-blue);text-decoration:none;">[' + num + ']</a></sup>';
    }
    return '<a href="/wiki/' + target + '" class="wikilink">' + label + '</a>';
  });

  var html = '<div class="query-answer-body">';

  // 如果有 thinking 内容 → 折叠
  if (data.thinking || data.think) {
    var thinkContent = data.thinking || data.think || '';
    html += '<details style="margin-bottom:1rem; font-size:0.85rem;">' +
      '<summary style="cursor:pointer; color:var(--text-muted);">🧠 推理过程</summary>' +
      '<div style="margin-top:0.5rem; padding:0.75rem; background:var(--code-bg); border-radius:var(--radius-sm); color:var(--text-secondary);">' +
      '<pre style="background:none; padding:0; margin:0; white-space:pre-wrap;">' + escapeHtml(thinkContent) + '</pre></div></details>';
  }

  // 回答正文
  html += renderedAnswer || answer;

  // 置信度
  html += '<div class="query-meta">';
  html += '<span class="text-sm">置信度: <span class="confidence-bar"><span class="confidence-fill ' + conf + '" style="width:' + (conf === 'high' ? '80' : conf === 'medium' ? '50' : '25') + '%"></span></span> ' + confLabels[conf] + '</span>';
  html += '</div>';

  // 参考文献卡片
  if (sources.length > 0) {
    html += '<div class="query-sources"><h4 style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.5rem;">📖 参考文献</h4><div style="display:flex;flex-wrap:wrap;gap:0.4rem;">';
    for (var i = 0; i < sources.length; i++) {
      var s = sources[i];
      var name = s.replace(/\.md$/, '').split('/').pop();
      html += '<a href="/wiki/' + s + '" class="btn btn-sm btn-secondary" style="font-size:0.8rem;border-radius:99px;"><sup style="color:var(--accent-blue);">[' + (i + 1) + ']</sup> ' + escapeHtml(name) + '</a>';
    }
    html += '</div></div>';
  }

  // 知识缺口
  if (data.gaps && data.gaps.length) {
    html += '<div class="query-gaps"><span class="text-sm" style="color:var(--warning);">⚠ 知识缺口: ' + data.gaps.join('; ') + '</span></div>';
  }

  // 归档信息
  if (data.archived) {
    html += '<div class="text-sm" style="margin-top:0.5rem; color:var(--success);">✓ 已归档: <a href="/wiki/' + data.archived + '">' + data.archived + '</a></div>';
  }

  html += '</div>';
  box.innerHTML = html;
}

function showError(msg) {
  var box = document.getElementById('answerBox');
  box.style.display = 'block';
  box.innerHTML = '<div class="error-state"><span>出错了</span><span class="text-sm">' + msg + '</span></div>';
}

function wikilinksToHtml(text) {
  if (!text) return '';
  return text.replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g, function(match, target, display) {
    var label = display || target;
    return '<a href="/wiki/' + target + '" class="wikilink">' + label + '</a>';
  });
}

function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

/* ===== 初始化 ===== */
document.addEventListener('DOMContentLoaded', function() {
  loadHistory();
});

document.getElementById('queryInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doQuery();
});
if (e.ctrlKey && e.key === 'Enter') doQuery();
</script>
{% endblock %}
