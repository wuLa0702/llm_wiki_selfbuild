{% extends "base.html" %}

{% block title %}活动面板 — LLM Wiki{% endblock %}

{% block content %}
<section class="page-header">
  <h1>⚡ 活动面板</h1>
  <p class="text-secondary text-sm">摄入队列实时状态 — 自动刷新</p>
</section>

<div id="panel">
  <div class="loading-state">
    <div class="spinner"></div>
    <span>获取队列状态…</span>
  </div>
</div>
<div class="text-muted text-xs" style="margin-top:0.5rem;" id="lastUpdate"></div>
{% endblock %}

{% block scripts %}
<script>
async function refresh() {
  const panel = document.getElementById('panel');

  try {
    const res = await fetch('/v1/ingest/queue/status');
    const d = await res.json();

    const total = d.total || 0;
    const done = d.done || 0;
    const failed = d.failed || 0;
    const pending = d.pending || 0;
    const processing = d.processing || 0;
    const pct = total > 0 ? Math.round((done + failed) / total * 100) : 0;

    if (total === 0) {
      panel.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚡</div><p class="text-muted">当前没有任务。提交文件后这里会显示进度。</p></div>';
      document.getElementById('lastUpdate').textContent = '';
      return;
    }

    let html = '<div class="progress-bar" style="margin-bottom:1rem;"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    html += '<p class="text-sm text-muted" style="text-align:center;">' + pct + '% (' + done + '/' + total + ')</p>';

    html += '<div class="stat-cards" style="display:flex; gap:0.75rem; flex-wrap:wrap;">';
    html += '<div class="stat-card" style="flex:1; min-width:70px;"><div class="stat-value" style="font-size:1.5rem;">' + total + '</div><div class="stat-label">总任务</div></div>';
    html += '<div class="stat-card" style="flex:1; min-width:70px; border-top-color:var(--warning);"><div class="stat-value" style="font-size:1.5rem; color:var(--warning);">' + pending + '</div><div class="stat-label">排队</div></div>';
    html += '<div class="stat-card" style="flex:1; min-width:70px; border-top-color:var(--accent);"><div class="stat-value" style="font-size:1.5rem; color:var(--accent);">' + processing + '</div><div class="stat-label">处理中</div></div>';
    html += '<div class="stat-card" style="flex:1; min-width:70px; border-top-color:var(--success);"><div class="stat-value" style="font-size:1.5rem; color:var(--success);">' + done + '</div><div class="stat-label">完成</div></div>';
    html += '<div class="stat-card" style="flex:1; min-width:70px; border-top-color:var(--error);"><div class="stat-value" style="font-size:1.5rem; color:var(--error);">' + failed + '</div><div class="stat-label">失败</div></div>';
    html += '</div>';

    if (d.message) {
      html += '<p class="text-sm text-muted" style="text-align:center; margin-top:0.5rem;">' + d.message + '</p>';
    }

    panel.innerHTML = html;
    document.getElementById('lastUpdate').textContent = '最后更新: ' + new Date().toLocaleTimeString();
  } catch (err) {
    panel.innerHTML = '<div class="error-state"><span>⚠ 无法获取队列状态</span><span class="text-sm">' + err.message + '</span></div>';
  }
}

refresh();
setInterval(refresh, 3000);
</script>
{% endblock %}
