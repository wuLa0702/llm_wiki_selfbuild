{% extends "base.html" %}

{% block title %}资料源 — LLM Wiki{% endblock %}

{% block content %}
<section class="page-header">
  <h1>📂 资料源文件</h1>
  <p class="text-secondary text-sm" id="summary">加载中…</p>
</section>

<div id="sourceList"></div>
<div id="sentinel" class="sentinel" style="height:1px;"></div>
<div id="loading" class="loading-state hidden">
  <div class="spinner"></div>
  <span>加载更多…</span>
</div>
<div id="loading-done" class="empty-state hidden" style="padding:1rem;">
  <p class="text-muted text-sm">— 已加载全部 —</p>
</div>
{% endblock %}

{% block scripts %}
<script>
let page = 1;
let totalPages = 1;
let loading = false;

async function loadPage() {
  if (loading || page > totalPages) return;
  loading = true;
  document.getElementById('loading').classList.remove('hidden');

  try {
    const res = await fetch('/v1/sources?page=' + page + '&per_page=50');
    const data = await res.json();
    totalPages = data.total_pages || 1;
    document.getElementById('summary').textContent = '共 ' + data.total + ' 个源文件';

    const list = document.getElementById('sourceList');
    for (const s of data.sources || []) {
      const item = document.createElement('div');
      item.className = 'source-item';
      item.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:0.6em 0.8em; border-bottom:1px solid var(--border); font-size:0.9rem;';
      const sizeStr = s.size > 10240 ? (s.size / 1024).toFixed(1) + ' KB' : s.size + ' B';
      item.innerHTML =
        '<span class="source-name" style="flex:1; color:var(--accent); cursor:pointer; word-break:break-all;" onclick="window.location=\'/wiki/sources/' + s.path + '\'">' +
        '{{ "&#128196;" }} ' + s.path + '</span>' +
        '<span class="source-meta" style="flex-shrink:0; text-align:right; margin-left:1em;">' +
        '<span class="source-size text-muted text-sm">' + sizeStr + '</span>' +
        '<span class="source-date text-muted text-xs" style="margin-left:0.5em;">' + (s.modified || '') + '</span>' +
        '</span>';
      list.appendChild(item);
    }
    page++;
  } catch (err) {
    document.getElementById('loading').innerHTML = '<span>加载失败: ' + err.message + '</span>';
  }
  loading = false;
  if (page > totalPages) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('loading-done').classList.remove('hidden');
  } else {
    document.getElementById('loading').classList.add('hidden');
  }
}

const sentinel = document.getElementById('sentinel');
const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) loadPage();
});
observer.observe(sentinel);

loadPage();
</script>
{% endblock %}
