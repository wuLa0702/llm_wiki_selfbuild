{% extends "base.html" %}

{% block title %}资料源 — LLM Wiki{% endblock %}

{% block head_extra %}
{# 样式已迁移至 static/css/components.css（ht mx 导航需要） #}
{% endblock %}

{% block content %}
<div class="sources-main">
  <!-- 头部 -->
  <div class="sources-header">
    <span class="sources-header-title">📂 原始资料</span>
    <div class="sources-header-actions">
      <button class="btn btn-sm" onclick="loadSourceFiles()" title="刷新">🔄</button>
      <button class="btn btn-sm btn-primary" onclick="document.getElementById('singleFileInput').click()">+ 导入</button>
      <button class="btn btn-sm" onclick="document.getElementById('folderUploadInput').click()">+ 文件夹</button>
      <input type="file" id="singleFileInput" style="display:none;" multiple onchange="uploadFiles(this)">
      <input type="file" id="folderUploadInput" style="display:none;" webkitdirectory multiple onchange="uploadFolder(this)">
    </div>
  </div>

  <!-- 文件列表 / 预览 -->
  <div id="sources-content-area" style="flex:1;display:flex;flex-direction:column;min-height:0;">
    <div class="sources-list" id="sources-list">
      <div class="loading-state" style="padding:2rem;">
        <div class="spinner" style="width:20px;height:20px;"></div>
      </div>
    </div>
    <div class="sources-preview hidden" id="sources-preview"></div>
  </div>

  <!-- 底部 -->
  <div class="sources-footer">
    <span id="sources-footer-text">0 个资料</span>
    <button class="btn btn-sm" onclick="loadSourceFiles()">🔄 刷新文件夹</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var _selectedPath = null;

/* ===== 加载文件列表 ===== */
async function loadSourceFiles() {
  var list = document.getElementById('sources-list');
  var preview = document.getElementById('sources-preview');
  // foot er text updated below via getElementById
  if (!list) return;
  list.classList.remove('hidden');
  preview.classList.add('hidden');
  list.innerHTML = '<div class="loading-state" style="padding:2rem;"><div class="spinner" style="width:20px;height:20px;"></div></div>';

  try {
    var r = await fetch('/v1/sources/tree');
    var d = await r.json();
    var tree = d.tree || [];
    var totalFiles = d.total_files || 0;
    document.getElementById('sources-footer-text').textContent = totalFiles + ' 个资料';

    if (!tree.length) {
      list.innerHTML = '<div class="sources-empty"><div class="sources-empty-icon">📂</div><p>暂无资料源文件</p><p class="text-sm text-muted">点击右上角「导入」添加文件</p></div>';
      return;
    }

    list.innerHTML = renderFileListView(tree);
  } catch(e) {
    list.innerHTML = '<div class="error-state" style="margin:1rem;"><p>加载失败: ' + e.message + '</p><button class="btn btn-sm" onclick="loadSourceFiles()">重试</button></div>';
  }
}

function renderFileListView(tree) {
  var html = '';
  // 目录排前面，文件排后面
  var dirs = tree.filter(function(i) { return i.type === 'directory'; });
  var files = tree.filter(function(i) { return i.type === 'file'; });

  for (var d = 0; d < dirs.length; d++) {
    var dir = dirs[d];
    var children = dir.children || [];
    var fileCount = children.filter(function(c) { return c.type === 'file'; }).length;
    html += '<div class="sources-folder-group">';
    html += '<div class="sources-folder-header" onclick="toggleFolder(this)" data-path="' + dir.path + '">';
    html += '<span class="chevron open">&#9654;</span> 📁 <span class="file-name">' + dir.name + '</span>';
    html += '<span class="sources-folder-count">' + fileCount + '</span>';
    html += '<span class="folder-actions">';
    html += '<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteFolder(\'' + dir.path + '\')" title="删除文件夹">🗑</button>';
    html += '</span>';
    html += '</div>';
    html += '<div class="sources-folder-children">';
    // 子文件
    for (var f = 0; f < children.length; f++) {
      var child = children[f];
      if (child.type === 'file') {
        html += '<div class="sources-file-row" onclick="selectSource(\'' + child.path + '\', this)" data-path="' + child.path + '">';
        html += '<span class="file-icon">📄</span>';
        html += '<span class="file-name">' + child.name + '</span>';
        html += '<span class="file-actions">';
        html += '<button class="btn btn-sm" onclick="event.stopPropagation();extractFile(\'' + child.path + '\')" title="提取到Wiki">✨</button>';
        html += '<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteFile(\'' + child.path + '\')" title="删除">🗑</button>';
        html += '</span>';
        html += '</div>';
      }
    }
    html += '</div></div>';
  }

  // 根目录文件
  for (var f = 0; f < files.length; f++) {
    var file = files[f];
    html += '<div class="sources-folder-group">';
    html += '<div class="sources-file-row" onclick="selectSource(\'' + file.path + '\', this)" data-path="' + file.path + '" style="padding-left:1.25rem;">';
    html += '<span class="file-icon">📄</span>';
    html += '<span class="file-name">' + file.name + '</span>';
    html += '<span class="file-actions">';
    html += '<button class="btn btn-sm" onclick="event.stopPropagation();extractFile(\'' + file.path + '\')" title="提取到Wiki">✨</button>';
    html += '<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteFile(\'' + file.path + '\')" title="删除">🗑</button>';
    html += '</span>';
    html += '</div></div>';
  }

  return html;
}

function toggleFolder(el) {
  var chevron = el.querySelector('.chevron');
  var children = el.nextElementSibling;
  if (chevron) chevron.classList.toggle('open');
  if (children) children.classList.toggle('hidden');
}

/* ===== 选中文件 → 预览 ===== */
async function selectSource(path, el) {
  _selectedPath = path;
  // 高亮
  document.querySelectorAll('.sources-file-row.active').forEach(function(e) { e.classList.remove('active'); });
  if (el) el.classList.add('active');

  var list = document.getElementById('sources-list');
  var preview = document.getElementById('sources-preview');
  list.classList.add('hidden');
  preview.classList.remove('hidden');
  preview.innerHTML = '<div class="loading-state"><div class="spinner" style="width:20px;height:20px;"></div></div>';

  try {
    var r = await fetch('/v1/file-content?path=' + encodeURIComponent(path));
    var d = await r.json();
    if (d.content !== undefined) {
      var content = d.content;
      var sizeStr = d.size > 10240 ? (d.size/1024).toFixed(1) + ' KB' : d.size + ' B';
      var html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">';
      html += '<h2 style="border:none;margin:0;">' + path.split('/').pop() + '</h2>';
      html += '<div class="flex gap-sm">';
      html += '<button class="btn btn-sm" onclick="deleteFile(\'' + path + '\')">🗑 删除</button>';
      html += '<button class="btn btn-sm btn-primary" onclick="extractFile(\'' + path + '\')">✨ 提取到 Wiki</button>';
      html += '<span class="text-xs text-muted" style="align-self:center;">' + sizeStr + '</span>';
      html += '<button class="btn btn-sm" onclick="backToList()">✕ 关闭</button>';
      html += '</div></div>';
      if (path.endsWith('.md') && typeof marked !== 'undefined') {
        html += '<div class="page-content">' + marked.parse(content) + '</div>';
      } else {
        html += '<pre style="white-space:pre-wrap;word-break:break-word;font-size:0.82rem;line-height:1.5;background:var(--bg-surface);padding:1rem;border-radius:var(--radius-md);">' + escapeHtml(content.substring(0, 5000)) + '</pre>';
      }
      preview.innerHTML = html;
      setTimeout(function() {
        document.querySelectorAll('pre code').forEach(function(b) { if (typeof hljs !== 'undefined') hljs.highlightElement(b); });
      }, 50);
    }
  } catch(e) {
    preview.innerHTML = '<div class="error-state"><p>加载失败: ' + e.message + '</p></div>';
  }
}

function backToList() {
  document.getElementById('sources-list').classList.remove('hidden');
  document.getElementById('sources-preview').classList.add('hidden');
}

/* ===== 操作 ===== */
async function deleteFile(path) {
  if (!confirm('删除此文件？将同时删除关联的 Wiki 页面。')) return;
  var r = await fetch('/v1/sources/delete?path=' + encodeURIComponent(path), { method: 'DELETE' });
  var d = await r.json();
  if (d.status === 'deleted') {
    showToast('已删除，级联删除了 ' + d.wiki_pages_deleted + ' 个 Wiki 页面');
    backToList();
    loadSourceFiles();
    if (typeof loadTree === 'function') loadTree();
    if (typeof pollActivity === 'function') pollActivity();
  } else {
    alert('删除失败: ' + (d.error || '未知错误'));
  }
}

async function deleteFolder(path) {
  if (!confirm('确定删除此文件夹及其所有子文件？将级联删除关联的 Wiki 页面。')) return;
  var r = await fetch('/v1/sources/folder/' + path, { method: 'DELETE' });
  var d = await r.json();
  if (d.status === 'deleted') {
    showToast('已删除文件夹及 ' + d.wiki_pages_deleted + ' 个关联页面');
    loadSourceFiles();
    if (typeof loadTree === 'function') loadTree();
    if (typeof pollActivity === 'function') pollActivity();
  } else {
    alert('删除失败: ' + (d.error || '未知错误'));
  }
}

async function extractFile(path) {
  var preview = document.getElementById('sources-preview');
  preview.innerHTML = '<div class="loading-state"><div class="spinner" style="width:24px;height:24px;"></div><span>Agent 提取中…</span></div>';
  try {
    var r = await fetch('/v1/sources/extract-to-wiki', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ source_path: path }) });
    var d = await r.json();
    if (d.status === 'ok') {
      preview.innerHTML = '<div class="empty-state"><div style="font-size:1.5rem;">✅</div><p>提取完成</p><p class="text-sm text-muted">创建: ' + (d.pages_created?.length || 0) + '，更新: ' + (d.pages_updated?.length || 0) + '</p><ul class="text-sm">' + (d.pages_created || []).map(function(p) { return '<li><a href="/wiki/' + encodeURIComponent(p) + '">' + p + '</a></li>'; }).join('') + '</ul><button class="btn btn-sm" style="margin-top:0.5rem;" onclick="backToList()">返回列表</button></div>';
      loadSourceFiles();
    } else {
      preview.innerHTML = '<div class="error-state"><p>' + (d.error || '提取失败') + '</p><button class="btn btn-sm" onclick="backToList()">返回</button></div>';
    }
  } catch(e) {
    preview.innerHTML = '<div class="error-state"><p>' + e.message + '</p><button class="btn btn-sm" onclick="backToList()">返回</button></div>';
  }
}

/* ===== 导入 + 文件夹 ===== */
function pollImportProgress(total, btn) {
  var interval = setInterval(function() {
    fetch('/v1/ingest/queue/status')
      .then(function(r) { return r.json(); })
      .then(function(q) {
        var done = (q.done || 0) + (q.failed || 0);
        if (btn) btn.textContent = '导入中 ' + done + '/' + total;
        if (done >= total) {
          clearInterval(interval);
          if (btn) { btn.disabled = false; btn.textContent = '📁 导入'; }
          loadSourceFiles();
          pollActivity();
          showToast('导入完成: ' + total + ' 个文件');
        }
      })
      .catch(function() { clearInterval(interval); if (btn) { btn.disabled = false; btn.textContent = '📁 导入'; } });
  }, 2000);
}

function uploadFiles(input) {
  var files = input.files;
  if (!files || !files.length) return;
  var btn = document.querySelector('.sources-header-actions .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = '上传中…'; }
  var fd = new FormData();
  for (var i = 0; i < files.length; i++) {
    fd.append('files', files[i], files[i].name);
  }
  fetch('/v1/ingest/upload', { method:'POST', body: fd })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var total = d.total || d.enqueued || 0;
      if (d.saved > 0 && total > 0) {
        pollImportProgress(total, btn);
      } else {
        if (btn) { btn.disabled = false; btn.textContent = '+ 导入'; }
        showToast('没有可导入的文件');
      }
      loadSourceFiles();
    })
    .catch(function() { if (btn) { btn.disabled = false; btn.textContent = '+ 导入'; } showToast('上传失败'); });
  input.value = '';
}

function uploadFolder(input) {
  var files = input.files;
  if (!files || !files.length) return;
  var btn = document.querySelector('[onclick*="folderUploadInput"]');
  if (btn) { btn.disabled = true; btn.textContent = '上传中…'; }
  var fd = new FormData();
  for (var i = 0; i < files.length; i++) {
    fd.append('files', files[i], files[i].webkitRelativePath || files[i].name);
  }
  fetch('/v1/ingest/upload', { method:'POST', body: fd })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var total = d.total || d.enqueued || 0;
      if (d.saved > 0 && total > 0) {
        pollImportProgress(total, btn);
      } else {
        if (btn) { btn.disabled = false; btn.textContent = '+ 文件夹'; }
        showToast('没有可导入的文件');
      }
      loadSourceFiles();
    })
    .catch(function() { if (btn) { btn.disabled = false; btn.textContent = '+ 文件夹'; } showToast('上传失败'); });
  input.value = '';
}

loadSourceFiles();
</script>
{% endblock %}
