{% extends "base.html" %}

{% block title %}设置 — LLM Wiki{% endblock %}

{% block content %}
<section class="page-header">
  <h1>⚙️ 设置</h1>
  <p class="text-secondary text-sm">Wiki 应用信息与环境配置</p>
</section>

<div class="card">
  <div class="card-header">ℹ️ 关于</div>
  <div class="card-body">
    <dl class="frontmatter-card">
      <dt>应用</dt>
      <dd>LLM Wiki</dd>
      <dt>版本</dt>
      <dd>Phase 6 (UI 美化)</dd>
      <dt>引擎</dt>
      <dd>FastAPI + Jinja2</dd>
      <dt>数据</dt>
      <dd>SQLite + Markdown 文件</dd>
    </dl>
  </div>
</div>

<div class="card">
  <div class="card-header">🎨 外观</div>
  <div class="card-body">
    <p class="text-sm text-secondary">点击导航栏 <strong>🌙</strong> 按钮切换暗色/亮色模式。</p>
    <p class="text-sm text-secondary">设置保存在浏览器 localStorage 中。</p>
  </div>
</div>
{% endblock %}
